name: Dependency audit (PAT-03 / SUP-01)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Lunes 09:00 UTC — captura CVEs nuevos sobre dependencias sin cambios
    - cron: "0 9 * * 1"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # versión tomada de "packageManager" en package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (falla ante high/critical)
        run: pnpm audit --audit-level=high
